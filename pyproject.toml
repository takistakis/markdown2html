[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown2html"
version = "0.3.0"
description = "Convert a GitHub Flavored Markdown file to HTML."
authors = [{ name = "Panagiotis Ktistakis", email = "panktist@gmail.com" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "Markdown>=3.10.2",
    "Pygments>=2.20.0",
]

[project.optional-dependencies]
extra = ["pymdown-extensions>=10.21.2"]

[project.urls]
Homepage = "https://github.com/forkbong/markdown2html"

[project.scripts]
markdown2html = "markdown2html:main"
